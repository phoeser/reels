<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Vorschau</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
html,body{margin:0}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f4f5;color:#231a1f;font-family:Inter,system-ui,sans-serif;padding:16px;box-sizing:border-box}
#gate form{background:#fff;border:1px solid #e2dadd;border-radius:10px;padding:28px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px}
#gate h1{font-family:"Space Grotesk",system-ui,sans-serif;font-size:24px;margin:0}
#gate p{margin:0;font-size:15px;color:#6b5d64}
#gate input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #cfc4c8;border-radius:6px}
#gate button{font:inherit;font-weight:600;font-size:16px;padding:10px 12px;border:0;border-radius:6px;background:#8a1538;color:#fff;cursor:pointer}
#gate button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.4em;color:#8a1538;font-size:14px}
@media (prefers-color-scheme: dark){#gate{background:#171215;color:#f1eaed}#gate form{background:#211a1e;border-color:#372c31}#gate p{color:#a8989f}#gate input{background:#171215;color:#f1eaed;border-color:#372c31}#msg{color:#f08aa6}}
.ld{display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;margin:0;background:#000 center/cover no-repeat;cursor:pointer;position:relative}
.ld span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.62);color:#fff;font:600 16px Inter,system-ui,sans-serif;padding:10px 18px;border-radius:999px;white-space:nowrap}
.ld:hover span,.ld:focus-visible span{background:#8a1538}
</style></head><body>
<div id="gate"><form id="f" autocomplete="off">
<h1>Vorschau</h1><p>Dieser Bereich ist geschützt. Bitte Passwort eingeben.</p>
<input id="pw" type="password" aria-label="Passwort" autofocus required>
<button id="go" type="submit">Öffnen</button><div id="msg" role="alert"></div></form></div>
<div id="app" hidden></div>
<script>
const SALT="b89ccb7000892d6b867835f56160f0c4";let KEY=null;
const hex=h=>new Uint8Array(h.match(/../g).map(b=>parseInt(b,16)));
async function mk(pw){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:hex(SALT),iterations:250000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["decrypt"]);}
async function dec(path,c){const r=await fetch(path,{cache:c||"default"});if(!r.ok)throw new Error("Laden fehlgeschlagen");const b=new Uint8Array(await r.arrayBuffer());
 return crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},KEY,b.slice(12));}
async function open_(pw){KEY=await mk(pw.toLowerCase().replace(/\s+/g,""));
 const p=JSON.parse(new TextDecoder().decode(await dec("d/p.bin","no-cache")));
 const st=document.createElement("style");st.textContent=p.style;document.head.appendChild(st);
 const app=document.getElementById("app");app.innerHTML=p.body;document.getElementById("gate").remove();app.hidden=false;document.title="Spot-Vorschau";
 app.querySelectorAll(".ld").forEach(async b=>{const n=b.dataset.v;
  try{const j=await dec("d/"+n+".j.bin");b.style.backgroundImage="url("+URL.createObjectURL(new Blob([j],{type:"image/jpeg"}))+")";}catch(e){}
  b.addEventListener("click",async()=>{const s=b.querySelector("span");s.textContent="Lädt …";b.disabled=true;
   try{const v=await dec("d/"+n+".v.bin");const el=document.createElement("video");el.controls=true;el.playsInline=true;el.autoplay=true;
    el.src=URL.createObjectURL(new Blob([v],{type:"video/mp4"}));b.replaceWith(el);}
   catch(e){s.textContent="Fehler, bitte erneut tippen";b.disabled=false;}});});}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const go=document.getElementById("go"),msg=document.getElementById("msg");
 go.disabled=true;msg.textContent="";
 try{await open_(document.getElementById("pw").value);try{sessionStorage.setItem("k",document.getElementById("pw").value)}catch(_){}}
 catch(err){msg.textContent=err&&err.name==="OperationError"?"Das Passwort stimmt nicht.":"Das hat nicht geklappt. Bitte noch einmal versuchen.";go.disabled=false;}});
try{const k=sessionStorage.getItem("k");if(k)open_(k).catch(()=>{});}catch(_){}
</script></body></html>
